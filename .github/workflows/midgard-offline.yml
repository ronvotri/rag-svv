name: Midgard Offline - Test and Build
on:
  push:
    paths: ['midgard-offline/**', '.github/workflows/midgard-offline.yml']
  pull_request:
    paths: ['midgard-offline/**', '.github/workflows/midgard-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check midgard-offline/engine.js
          node --check midgard-offline/game.js
      - name: Test game rules
        run: node --test midgard-offline/tests/*.test.cjs
      - name: Package offline game
        run: node midgard-offline/tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: midgard-offline
          path: |
            midgard-offline/dist/*.zip
            midgard-offline/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
