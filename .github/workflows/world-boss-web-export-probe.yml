name: World Boss - Web export probe
on:
  push:
    branches: [feature/offline-cards-unique-npc-wave34, feature/daily-native-integration-wave35]
    paths:
      - 'midgard-offline/original-addons/**'
      - 'midgard-offline/tools/**'
      - 'midgard-offline/tests/**'
      - 'midgard-offline/config/**'
      - 'midgard-offline/patches/**'
      - 'midgard-offline/review/upstream-0.2.11-pin.json'
      - 'midgard-offline/review/run-web-export-probe.py'
      - 'midgard-offline/review/build-local-mvp-web-preview.py'
      - 'midgard-offline/review/friend-town-visual-review.gd'
      - 'midgard-offline/tools/prepare-original-web-deploy.py'
      - 'midgard-offline/cloudflare/pages-bootstrap.html'
      - 'midgard-offline/tests/test_original_web_deploy.py'
      - '.github/workflows/world-boss-web-export-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-boss-web-export-probe
  cancel-in-progress: false
jobs:
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authored code and translations (Wave 35)
        if: github.ref == 'refs/heads/feature/daily-native-integration-wave35'
        run: |
          node --test midgard-offline/tests/*.test.cjs
          python -m unittest discover -s midgard-offline/tests -p 'test_*.py'
          python -m py_compile midgard-offline/tools/*.py
      - name: Check export entrypoints
        run: |
          python -m py_compile midgard-offline/review/build-local-mvp-web-preview.py midgard-offline/review/run-web-export-probe.py midgard-offline/tools/prepare-original-web-deploy.py
          python -m unittest discover -s midgard-offline/tests -p 'test_original_web_deploy.py'
      - name: Export Web inside isolated runner
        run: python midgard-offline/review/run-web-export-probe.py
      - name: Upload export metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-boss-web-export-report
          path: midgard-offline/work/world-boss-web-export-probe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload rendered visual review screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friend-town-visual-review
          path: |
            midgard-offline/work/friend-visual-review/prontera-npcs.png
            midgard-offline/work/friend-visual-review/portrait-sprite-review.png
            midgard-offline/work/friend-visual-review/hair-palette-review.png
            midgard-offline/work/friend-visual-review/hairstyle-review.png
            midgard-offline/work/friend-visual-review/clothing-review.png
            midgard-offline/work/friend-visual-review/headgear-review.png
            midgard-offline/work/friend-visual-review/friend-visual-report.json
          if-no-files-found: ignore
          retention-days: 7
