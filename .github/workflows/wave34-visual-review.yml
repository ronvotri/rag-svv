name: Wave 34 - review actual Prontera screenshots
on:
  push:
    branches: [feature/offline-cards-unique-npc-wave34]
    paths: [.github/workflows/wave34-visual-review.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download previously successful Windows Godot QA (run 45049541550)
        uses: actions/download-artifact@v4
        with:
          name: original-offline-windows-TEST
          run-id: 45049541550
          github-token: ${{ github.token }}
          path: source
      - name: Extract only the small original in-game screenshot evidence
        run: |
          set -euo pipefail
          find source -maxdepth 2 -type f -printf '%p (%s bytes)\n'
          bundle="$(find source -type f -name 'Prontera-Visual-QA.zip' -print -quit)"
          test -n "$bundle"
          mkdir -p review
          unzip -j -o "$bundle" '*.png' -d review
          test -s review/original-town.png
          test -s review/town-offline-cards.png
          test -s review/town-npcs-390x844.png
          test -s review/town-npcs-844x390.png
          echo 'Actual Godot screenshots were extracted, not illustrations.'
      - name: Upload lightweight Wave 34 screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: wave34-prontera-offline-screenshots
          path: review/*.png
          retention-days: 7
          if-no-files-found: error
