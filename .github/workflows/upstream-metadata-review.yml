name: Upstream client - metadata review only
on:
  push:
    branches: [feature/offline-cards-unique-npc-wave34]
    paths:
      - 'midgard-offline/tools/audit-upstream-client.py'
      - '.github/workflows/upstream-metadata-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-metadata-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded ZIP directory parser
        run: python midgard-offline/tools/audit-upstream-client.py --self-test
      - name: Inspect official free ZIP metadata without downloading PCK
        run: python midgard-offline/tools/audit-upstream-client.py
      - name: Upload metadata review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-metadata-review
          path: midgard-offline/work/upstream-metadata-review.json
          if-no-files-found: ignore
          retention-days: 7
