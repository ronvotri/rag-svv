name: Ragnarok SVV - publish original Web (Pages Free)
on:
  workflow_dispatch:
    inputs:
      redistribution_rights_confirmed:
        type: boolean
        required: true
        default: false
        description: "I have permission to publicly host and redistribute the original game assets."
permissions:
  contents: read
concurrency:
  group: ragnarok-web-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.redistribution_rights_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: web-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout the original client tooling (no game assets in Git)
        uses: actions/checkout@v4
        with:
          # Wave 28 only: keep release isolated from default source branch.
          ref: feature/offline-friends-wave12-prontera-playtest
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure this run targets the Wave 28 branch only
        run: |
          test "$GITHUB_REF_NAME" = "feature/offline-friends-wave12-prontera-playtest"
          test "$(git branch --show-current)" = "feature/offline-friends-wave12-prontera-playtest"
      - name: Verify Pages credentials (R2 credentials are NOT required)
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Validate authored code and binary-chunk loader
        run: |
          node --test midgard-offline/tests/*.test.cjs
          python -m unittest discover -s midgard-offline/tests -p 'test_*.py'
          python -m py_compile midgard-offline/tools/*.py
      - name: Rebuild original Godot Web client and run offline gameplay smoke tests
        env:
          SVV_WEB_NPC_QA: "1"
        run: python midgard-offline/tools/cloud-build-original.py --target web
      - name: Stage only static Cloudflare Pages assets
        id: pack
        run: |
          CLIENT_SHA="$(git rev-parse HEAD)"
          echo "sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"
          python midgard-offline/tools/prepare-original-web-deploy.py --version "$CLIENT_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("midgard-offline/work/cloud/cloudflare-deploy")
          manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))
          assets = [p for p in (base / "public").rglob("*") if p.is_file()]
          assert len(assets) <= 20000, "Exceeds Cloudflare Pages Free file count"
          assert all(p.stat().st_size <= 25 * 1024 * 1024 for p in assets)
          assert manifest["large_assets"], "Expected original Godot large files to be split"
          assert not (base / "r2").exists(), "Unexpected R2 asset output"
          assert not (base / "functions").exists(), "Unexpected Pages Functions"
          print("STATIC PAGES PASS:", len(assets), "files and", len(manifest["large_assets"]), "split assets")
          PY
      - name: Read existing Pages project's production branch
        id: pages
        run: |
          BRANCH="$(python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen
          url = "https://api.cloudflare.com/client/v4/accounts/%s/pages/projects/rag-svv-web" % os.environ["CLOUDFLARE_ACCOUNT_ID"]
          request = Request(url, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
          with urlopen(request, timeout=30) as response:
              body = json.load(response)
          branch = (body.get("result") or {}).get("production_branch")
          if not body.get("success") or not branch or not re.fullmatch(r"[A-Za-z0-9._/-]+", branch):
              raise SystemExit("Could not verify Cloudflare Pages production branch")
          print(branch)
          PY
          )"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Publish static Pages package (no R2, no server functions)
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name rag-svv-web \
            --branch "${{ steps.pages.outputs.branch }}" \
            --commit-hash "${{ steps.pack.outputs.sha }}"
        working-directory: midgard-offline/work/cloud/cloudflare-deploy
      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Ragnarok Web: Pages-only deployment submitted"
            echo "Project: rag-svv-web"
            echo "Original client commit: ${{ steps.pack.outputs.sha }}"
            echo "Preview: Wave 28 Cole/Haneul visual-only Town QA."
            echo "HTTPS site: https://rag-svv-web.pages.dev"
            echo "No R2, database or backend gameplay server."
            echo "Browser/device QA and player-save QA are still required."
          } >> "$GITHUB_STEP_SUMMARY"
