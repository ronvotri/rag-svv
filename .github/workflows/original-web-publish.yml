name: Ragnarok SVV - publish original Web (Cloudflare)
on:
  workflow_dispatch:
    inputs:
      redistribution_rights_confirmed:
        type: boolean
        required: true
        default: false
        description: "I have permission to publicly host and redistribute the original game assets."
permissions:
  contents: read
concurrency:
  group: ragnarok-web-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.redistribution_rights_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: web-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout the ORIGINAL offline client source branch
        uses: actions/checkout@v4
        with:
          ref: feature/original-offline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials before handling game assets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
      - name: Validate authored code and translations
        run: |
          node --test midgard-offline/tests/*.test.cjs
          python -m unittest discover -s midgard-offline/tests -p 'test_*.py'
          python -m py_compile midgard-offline/tools/*.py
      - name: Reconstruct and export the original Godot Web client
        run: python midgard-offline/tools/cloud-build-original.py --target web
      - name: Prepare large-file-safe Cloudflare Pages + R2 package
        id: version
        run: |
          CLIENT_SHA="$(git rev-parse HEAD)"
          echo "sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"
          python midgard-offline/tools/prepare-original-web-deploy.py \
            --version "$CLIENT_SHA"
      - name: Install AWS CLI for reliable multipart R2 uploads
        run: python -m pip install --disable-pip-version-check awscli
      - name: Upload large Godot files to private R2 bucket
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          folder = Path("midgard-offline/work/cloud/cloudflare-deploy")
          manifest = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
          endpoint = f'https://{os.environ["CLOUDFLARE_ACCOUNT_ID"]}.r2.cloudflarestorage.com'
          bucket = manifest["bucket"]
          for item in manifest["large_assets"]:
              src = folder / "r2" / item["name"]
              dst = f's3://{bucket}/releases/{manifest["version"]}/{item["name"]}'
              subprocess.run([
                  "aws", "s3", "cp", str(src), dst,
                  "--endpoint-url", endpoint,
                  "--content-type", item["content_type"],
                  "--cache-control", "public,max-age=31536000,immutable",
                  "--only-show-errors",
              ], check=True)
          print(f'Uploaded {len(manifest["large_assets"])} versioned files to private R2.')
          PY
      - name: Publish small Web assets and R2 streaming function to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name rag-svv-web \
            --branch main \
            --config wrangler.toml \
            --commit-hash "${{ steps.version.outputs.sha }}"
        working-directory: midgard-offline/work/cloud/cloudflare-deploy
      - name: Publish deployment summary
        if: success()
        run: |
          {
            echo "## Ragnarok Web was submitted to Cloudflare Pages"
            echo "Project: rag-svv-web"
            echo "Source commit: ${{ steps.version.outputs.sha }}"
            echo "Game save is local in the browser; no cloud account or gameplay server."
            echo "Next: check the Cloudflare deployment URL and test in a real browser."
          } >> "$GITHUB_STEP_SUMMARY"
