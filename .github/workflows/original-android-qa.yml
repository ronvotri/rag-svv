name: Original client - Android native QA
on:
  workflow_dispatch:
  push:
    branches: [feature/original-offline]
    paths:
      - '.github/workflows/original-android-qa.yml'
permissions:
  contents: read
concurrency:
  group: original-android-native
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate original-client authored code and translation
        run: |
          node --test midgard-offline/tests/*.test.cjs
          python -m unittest discover -s midgard-offline/tests -p 'test_*.py'
          python -m py_compile midgard-offline/tools/*.py
      - name: Reconstruct, patch, test and export ORIGINAL Godot Android APK
        run: python midgard-offline/tools/cloud-build-original.py --target android
      - name: Validate Android artifact and build report
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path("midgard-offline/work/cloud/artifacts")
          apk = base / "MidgardSVV-Original-Offline-Android-DEBUG-TEST.apk"
          report = json.loads((base / "BUILD_STATUS.json").read_text(encoding="utf-8"))
          assert report["target"] == "android"
          assert report["source_runtime_qa"] == "passed"
          assert report["full_feature_acceptance"] is False
          assert apk.is_file() and apk.stat().st_size > 1024 * 1024, "Native APK missing"
          with apk.open("rb") as stream:
              assert stream.read(2) == b"PK", "Invalid APK ZIP header"
          manifest = (base / "android-manifest-check.txt").read_text(encoding="utf-8")
          assert "com.votrivalley.midgardsvvoffline" in manifest
          assert "android.permission.INTERNET" not in manifest
          print("Native Android DEBUG-TEST APK exists; signature/manifest validated by export helper.")
          print("NOT device performance/UX/save acceptance or release-signed APK.")
          PY
      - name: Print Android export diagnosis on failure
        if: failure()
        run: |
          if [ -f midgard-offline/work/cloud/artifacts/android-export.log ]; then
            tail -n 120 midgard-offline/work/cloud/artifacts/android-export.log
          fi
      - name: Upload original Godot Android native debug-test APK
        uses: actions/upload-artifact@v4
        with:
          name: original-offline-android-DEBUG-TEST
          path: |
            midgard-offline/work/cloud/artifacts/MidgardSVV-Original-Offline-Android-DEBUG-TEST.apk
            midgard-offline/work/cloud/artifacts/BUILD_STATUS.json
            midgard-offline/work/cloud/artifacts/SHA256SUMS.txt
            midgard-offline/work/cloud/artifacts/android-manifest-check.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload small continuation context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-client-context-android
          path: midgard-offline/work/cloud/context/*.json
          if-no-files-found: ignore
          retention-days: 7
